<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Emmanuel Reyna Robledo" />
  <meta name="keywords" content="study aids, flashcards, learning material" />
  <title>Flash Cards</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/vendor/normalize.css" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="page">
  <header class="header">
    <h1 class="header__title">
      <a class="header__link" href="#home">Flash Cards</a>
    </h1>
    <nav class="nav">
      <ul class="nav__links">
        <li><a href="#home" class="nav__link">My Decks</a></li>
        <li><a href="#notfound" class="nav__link">About</a></li>
      </ul>
    </nav>
  </header>
  <main class="page__main-content">

    <section id="home" class="decks">
      <h1 class="decks__title" id="My-Decks">My Decks</h1>
      <ul class="decks__list">
        <template id="deck-template">
          <li class="deck">
            <a href="#" class="deck__link"></a>
            <h2 class="deck__title"></h2>
            <div class="deck__row">
              <p class="deck__count"></p>
              <button type="button" class="deck__delete-btn" aria-label="delete item"></button>
            </div>
          </li>
        </template>
        <li>
          <button class="decks__new-deck-btn">+ New Deck</button>
        </li>
      </ul>
    </section>

    <section id="carousel" class="carousel">
      <h2 class="carousel__title"></h2>
      <div class="carousel__row">
        <button type="button" class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          aria-label="previous card"></button>
        <div class="carousel__card">
          <p class="carousel__card-text"></p>
        </div>
        <button type="button" class="carousel__btn carousel__btn_type_right" aria-label="next card"></button>
      </div>
      <button type="button" class="carousel__btn carousel__btn_type_flip" aria-label="flip card"></button>
    </section>

    <section id="notfound" class="notfound">
      <h2 class="notfound__status-code">404</h2>
      <p class="notfound__text">Sorry, nothing found!</p>
    </section>

  </main>
  <footer class="footer">
    <p class="footer__text">@2026 Emmanuel Reyna Robledo</p>
  </footer>
  <script src="assets/js/index.js" type="module"></script>
</body>

</html>
